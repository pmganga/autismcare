{% extends "base.html" %}
{% block title %}Log in · AutismCare{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Therapist login</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "includes/form.html" %}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p>New here? <a href="{% url 'register' %}">Register as a therapist</a></p>
</section>
{% endblock %}
